id: rbc_generic
description: >
  RBC: every prompt x every persona x six scenarios, with and without the model description in the prompt, on two LLM
  settings. Needs OPENAI_API_KEY in secrets/secrets.env. 2 prompts x 4 personas x 6 scenarios x 2 model-info settings =
  96 cells per LLM, times the repeats of every LLM whose temperature is not 0.
model: rbc

llms:
  gpt4o_mini_t0:
    provider: openai
    model_id: gpt-4o-mini
    temperature: 0.0
    api_key_env: OPENAI_API_KEY
  gpt4o_mini_t1:
    provider: openai
    model_id: gpt-4o-mini
    temperature: 1.0
    api_key_env: OPENAI_API_KEY

T: 120
prompts: [tfp, discount_factor]
personas: all
scenarios:
  pandemic_one_time: {shocks: {4: pandemic_rumours}}
  pandemic_wave: {shocks: {4: pandemic_rumours, 8: pandemic_peak, 12: pandemic_recedes}}
  pandemic_in_recession:
    narrative: recession
    shocks: {4: pandemic_rumours, 8: pandemic_peak, 12: pandemic_recedes}
  mixed_shocks: {shocks: {5: energy_price_spike, 12: sovereign_default, 20: technology_breakthrough}}
  sovereign_default_crisis:
    narrative: fragile_finances
    shocks: {4: sovereign_bond_selloff, 8: sovereign_default, 12: sovereign_restructuring}
  technology_boom: {shocks: {4: technology_breakthrough, 8: technology_rollout, 12: technology_mature}}
include_model_info: [false, true]
repeats: 5
tracked: [Z, beta, Y, C, I, K, L, r, w]
