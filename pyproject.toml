[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dgse-llm"
version = "0.1.0"
description = "Experiments that use LLM output to modify inputs of macroeconomic models"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pyyaml>=6",
    "jinja2>=3.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
ssj = ["sequence-jacobian"]
dev = ["pytest>=7.4"]

[project.scripts]
dgse-llm = "dgse_llm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dgse_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: calls a real LLM API; needs a key in secrets/ and --run-live",
    "slow: heterogeneous-agent model tests (tens of seconds)",
]
